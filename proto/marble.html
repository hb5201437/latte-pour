<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Marbling Latte Prototype</title>
<style>
  :root { --bg: #1d1410; --fg: #f3e9dc; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 16px; box-sizing: border-box; }
  canvas { width: min(92vw, 70vh); height: min(92vw, 70vh); touch-action: none; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  button { background: #3a2a20; color: var(--fg); border: 1px solid #5a4434; border-radius: 8px; padding: 6px 12px; font: inherit; }
  p { margin: 0; opacity: 0.7; text-align: center; max-width: 36em; }
  #st { font: 12px ui-monospace, monospace; opacity: 0.6; }
</style>
</head>
<body>
<canvas id="c" width="720" height="720"></canvas>
<div class="bar">
  <button id="demo">Rosetta demo</button>
  <button id="reset">Reset</button>
</div>
<p>Hold to pour, drag to move, wiggle left/right for lines. Swipe up fast (or hold Shift) to lift and pull through.</p>
<div id="st"></div>
<script type="module">
// 几何拉花原型的页面：手指/鼠标实时倒，或者播放示范倒法。
// 无头截图用 window.renderPour(segs, params, times)（见 dev/shot/marble.mjs）
import { Marble, P, ROSETTA, expand, runPour } from './marble.js';

const q = new URLSearchParams(location.search);
let over = {};
try { over = JSON.parse(q.get('p') || '{}'); } catch (e) { console.warn('bad ?p=', e); }
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const st = document.getElementById('st');
let m = new Marble(over);

// 无头脚本用：跑完整段倒法，返回最终图的 PNG data URL；给了 times 时返回 { final, snaps, stats }
window.P = P; window.ROSETTA = ROSETTA;
window.renderPour = (segs = ROSETTA, params = {}, times, size = 512) => {
  const r = runPour(segs, { ...over, ...params }, times || [], size);
  return times ? r : r.final;
};

// ---- 实时输入 ----
const ptr = { down: false, x: 0, y: 0, shift: false };
let demo = null, demoI = 0, liftHold = 0, hist = [];
function toCup(e) {
  const r = cv.getBoundingClientRect();
  const k = r.width * 0.94;                       // 杯口直径（CSS 像素）
  return [(e.clientX - r.left - r.width / 2) / k, -(e.clientY - r.top - r.height / 2) / k];
}
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptr.down = true; [ptr.x, ptr.y] = toCup(e); hist = []; demo = null; });
cv.addEventListener('pointermove', e => { [ptr.x, ptr.y] = toCup(e); });
const up = () => { ptr.down = false; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
addEventListener('keydown', e => { if (e.key === 'Shift') ptr.shift = true; });
addEventListener('keyup', e => { if (e.key === 'Shift') ptr.shift = false; });
document.getElementById('reset').onclick = () => { m = new Marble(over); demo = null; };
document.getElementById('demo').onclick = () => { m = new Marble(over); demo = expand(ROSETTA, m.p.dt, m.p); demoI = 0; };

let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  const dt = m.p.dt;
  while (acc >= dt) {
    acc -= dt;
    if (demo) {
      if (demoI < demo.length) m.step(demo[demoI++], dt); else { m.step({ pour: false }, dt); }
    } else if (ptr.down) {
      // 快速往上（前方）划 = 抬高拉过；按住 Shift 也算
      hist.push([now, ptr.y]); while (hist.length > 1 && now - hist[0][0] > 80) hist.shift();
      const vy = hist.length > 1 ? (hist[hist.length - 1][1] - hist[0][1]) / Math.max(1, now - hist[0][0]) * 1000 : 0;
      if (vy > 1.2 || ptr.shift) liftHold = 0.12;
      liftHold = Math.max(0, liftHold - dt);
      m.step({ x: ptr.x, y: ptr.y, pour: true, flow: 1, lift: liftHold > 0 ? 1 : 0, foam: true }, dt);
    } else m.step({ pour: false }, dt);
  }
  m.render(ctx, cv.width, { stream: true });
  const s = m.stats();
  st.textContent = `t ${m.t.toFixed(2)}s · ${s.polys} polys · ${s.verts} verts · ${s.msPerStep.toFixed(2)} ms/step`;
  requestAnimationFrame(frame);
}
if (!q.has('headless')) requestAnimationFrame(frame);
window.ready = true;
</script>
</body>
</html>
