<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Latte Pour</title>
  <link rel="stylesheet" href="style.css">
  <meta http-equiv="Cache-Control" content="no-cache">
</head>
<body>
  <main id="start" class="screen">
    <h1>Latte Pour</h1>
    <button id="startBtn" type="button" data-i18n="start">Start pouring</button>
    <p id="startNote" class="note"></p>
  </main>

  <main id="play" class="screen" hidden>
    <canvas id="cup"></canvas>
    <p id="hint" class="overlay-top note"></p>
    <button id="flipBtn" class="flip" type="button" hidden></button>
    <div id="result" class="result" hidden>
      <div class="score"><span id="scoreNum">0</span><span class="unit" data-i18n="points">pts</span></div>
      <p id="scoreTier" class="tier"></p>
      <div class="actions">
        <button id="againBtn" type="button" data-i18n="again">Pour again</button>
        <button id="saveBtn" type="button" class="secondary" data-i18n="save">Save image</button>
      </div>
    </div>
    <div id="savePanel" class="save-panel" hidden>
      <img id="saveImg" alt="Latte art">
      <p class="note" data-i18n="saveHint">Long-press the image to save it</p>
      <div class="actions">
        <a id="saveLink" download="latte-pour.png" data-i18n="download">Download image</a>
        <button id="saveClose" type="button" class="secondary" data-i18n="close">Close</button>
      </div>
    </div>
  </main>

  <main id="sensor" class="screen" hidden>
    <p id="mode" class="note"></p>
    <dl class="readout">
      <dt>beta（前后）</dt><dd id="beta">–</dd>
      <dt>gamma（左右）</dt><dd id="gamma">–</dd>
      <dt>alpha（朝向）</dt><dd id="alpha">–</dd>
      <dt>加速度 x</dt><dd id="ax">–</dd>
      <dt>加速度 y</dt><dd id="ay">–</dd>
      <dt>加速度 z</dt><dd id="az">–</dd>
      <dt>事件数</dt><dd id="count">0</dd>
    </dl>
  </main>

  <footer><span data-i18n="footer">Third-party code: none · Stats: GoatCounter (no cookies)</span> · <span id="build"></span></footer>

  <script>
    // GitHub Pages 让浏览器缓存脚本 10 分钟，刚部署完手机上可能还是旧版。
    // 每次打开都给所有脚本加时间戳（用 import map 改写模块路径），保证拿到最新版。
    (function () {
      var v = Date.now();
      var files = ['main', 'config', 'sensors', 'sim', 'pour', 'game', 'tilt', 'pitcher', 'score', 'snapshot', 'analytics', 'i18n'];
      var imports = {};
      files.forEach(function (f) { imports[new URL(f + '.js', location.href).href] = './' + f + '.js?v=' + v; });
      var map = document.createElement('script');
      map.type = 'importmap';
      map.textContent = JSON.stringify({ imports: imports });
      document.currentScript.after(map);
      var main = document.createElement('script');
      main.type = 'module';
      main.src = 'main.js?v=' + v;
      document.body.appendChild(main);
    })();
  </script>
</body>
</html>
