<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Latte Pour</title>
  <link rel="stylesheet" href="style.css">
  <meta http-equiv="Cache-Control" content="no-cache">
</head>
<body>
  <main id="start" class="screen">
    <h1>Latte Pour</h1>
    <button id="startBtn" type="button">开始倒奶</button>
    <p id="startNote" class="note"></p>
  </main>

  <main id="play" class="screen" hidden>
    <canvas id="cup"></canvas>
    <p id="hint" class="overlay-top note">在杯子下半部按住倒奶 · 按住时左右来回晃出千层纹 · 最后快速向上一划穿过收尾</p>
    <div id="result" class="overlay-bottom" hidden>
      <button id="againBtn" type="button">再来一次</button>
    </div>
  </main>

  <main id="sensor" class="screen" hidden>
    <p id="mode" class="note"></p>
    <dl class="readout">
      <dt>beta（前后）</dt><dd id="beta">–</dd>
      <dt>gamma（左右）</dt><dd id="gamma">–</dd>
      <dt>alpha（朝向）</dt><dd id="alpha">–</dd>
      <dt>加速度 x</dt><dd id="ax">–</dd>
      <dt>加速度 y</dt><dd id="ay">–</dd>
      <dt>加速度 z</dt><dd id="az">–</dd>
      <dt>事件数</dt><dd id="count">0</dd>
    </dl>
  </main>

  <footer>第三方库：无 · <span id="build"></span></footer>

  <script>
    // GitHub Pages 让浏览器缓存脚本 10 分钟，刚部署完手机上可能还是旧版。
    // 每次打开都给所有脚本加时间戳（用 import map 改写模块路径），保证拿到最新版。
    (function () {
      var v = Date.now();
      var files = ['main', 'config', 'sensors', 'sim', 'pour', 'game', 'tilt'];
      var imports = {};
      files.forEach(function (f) { imports[new URL(f + '.js', location.href).href] = './' + f + '.js?v=' + v; });
      var map = document.createElement('script');
      map.type = 'importmap';
      map.textContent = JSON.stringify({ imports: imports });
      document.currentScript.after(map);
      var main = document.createElement('script');
      main.type = 'module';
      main.src = 'main.js?v=' + v;
      document.body.appendChild(main);
    })();
  </script>
</body>
</html>
